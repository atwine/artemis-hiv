# Security scans on every push and pull request, and weekly so newly
# published library holes show up even when nobody pushes.
# Installed by the security-scans skill. Delete a job your project doesn't need.
name: security-scans

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets in the code and its history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose .

  python-deps:
    name: Python libraries with known holes (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit every requirements file
        # Accepted advisories (owner's decision, 2026-11-18; see docs/decisions.tsv).
        # chromadb 1.5.9: PYSEC-2026-311, -3813, -3814, -3815. No fixed release exists, and
        # all four need Chroma's HTTP server; this app only uses the embedded PersistentClient.
        # Revisited in Phase 2B (owner, 2026-11-26): keep Chroma and these four skips; 1.5.9 is still
        # the newest release. Recheck them whenever chromadb is upgraded, or if the app ever starts
        # Chroma's HTTP server (today only chromadb.PersistentClient is used, in vector_store.py
        # and scripts/check_index_sources.py).
        env:
          ACCEPTED: >-
            --ignore-vuln PYSEC-2026-311
            --ignore-vuln PYSEC-2026-3813
            --ignore-vuln PYSEC-2026-3814
            --ignore-vuln PYSEC-2026-3815
        run: |
          pip install pip-audit==2.10.1
          files=$(git ls-files '*requirements*.txt')
          if [ -z "$files" ]; then echo "No requirements files."; exit 0; fi
          status=0
          for f in $files; do
            echo "::group::$f"
            # shellcheck disable=SC2086
            pip-audit --progress-spinner off $ACCEPTED -r "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  code:
    name: Risky code patterns (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan with the default rule set
        run: semgrep scan --config p/default --error --metrics off
