# Runs the test suite on every push and pull request, so a change that breaks
# something shows up as a red check before it is merged.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        # The CPU build of torch first: the default Linux build pulls in about
        # 3 GB of GPU libraries that the tests never use.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run the tests
        # No model server here: the tests use stand-in clients, never a real LLM.
        run: python -m pytest -q
